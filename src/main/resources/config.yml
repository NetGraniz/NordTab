# MiniMessage formatting is supported.
header: '<dark_green><bold>Minecraft server</bold></dark_green>'
footer: '<gray><tps> tps  -  <online> players online  -  <ping> ping</gray>'

# 40 ticks = 2 seconds. Values below 20 are raised to 20.
update-interval-ticks: 40

# Keep player names plain and let the client arrange the center list.
plain-player-names: true
